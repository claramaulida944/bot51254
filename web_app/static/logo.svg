<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Core Brand Gradient -->
    <linearGradient id="rinaraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Accent Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="none" stroke="url(#borderGlow)" stroke-width="1.4"/>

  <!-- Subtle Circuit Dots -->
  <circle cx="10" cy="10" r="1.2" fill="#10b981" opacity="0.4"/>
  <circle cx="38" cy="38" r="1.2" fill="#06b6d4" opacity="0.4"/>

  <!-- STYLIZED 'R' & CYBER-NOVEL CORE EMBLEM -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Pillar with Book Spine Notch -->
    <path d="M14 11 H20 C27 11 31 14 31 19 C31 23 27.5 25.5 22.5 26 L31.5 37 H24.8 L17.5 26.5 H14 V37 H9.5 V11 H14 Z M14 22 H20 C23 22 25.5 21 25.5 18.5 C25.5 16 23 15 20 15 H14 V22 Z" 
          fill="url(#rinaraGrad)" />

    <!-- Dynamic Reading Energy Pulse (Cyber Lightning Flare) -->
    <polygon points="26,11 20,22 27,22 23,34 35,20 27.5,20" fill="url(#boltGrad)" opacity="0.95"/>

    <!-- Open Book Lower Flare Accent -->
    <path d="M12 39 C17 37 24 37.5 24 39 C24 37.5 31 37 36 39" 
          fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
